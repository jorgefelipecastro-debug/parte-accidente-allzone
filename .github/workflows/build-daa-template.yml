name: Build crisp classic DAA template

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-daa-template.yml"

permissions:
  contents: write

jobs:
  build-template:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Pillow
        run: python -m pip install --quiet pillow

      - name: Build exact classic DAA in high resolution
        shell: python
        run: |
          import base64, re
          from pathlib import Path
          from io import BytesIO
          from PIL import Image, ImageEnhance, ImageFilter

          app = Path("app.html")
          text = app.read_text(encoding="utf-8")

          m = re.search(
              r'"template"\s*:\s*\{\s*"src"\s*:\s*"data:image/png;base64,([^"]+)"\s*,\s*"w"\s*:\s*542\s*,\s*"h"\s*:\s*767\s*\}',
              text,
              re.S,
          )
          if not m:
              raise SystemExit("No se ha encontrado la plantilla clásica embebida 542x767.")

          src = Image.open(BytesIO(base64.b64decode(m.group(1)))).convert("RGB")
          if src.size != (542, 767):
              raise SystemExit(f"Tamaño inesperado de plantilla: {src.size}")

          # Misma geometría exacta, 4x de resolución.
          hq = src.resize((2168, 3068), Image.Resampling.LANCZOS)
          hq = ImageEnhance.Contrast(hq).enhance(1.06)
          hq = hq.filter(ImageFilter.UnsharpMask(radius=1.15, percent=145, threshold=2))
          hq.save("daa_classic_hq_exact.png", "PNG", optimize=True)

          old = "const templateReady=loadPicture(ARTWORK.template.src);"
          new = "const templateReady=loadPicture('./daa_classic_hq_exact.png?v=20260922');"
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit("No se encontró la línea de carga de la plantilla.")

          app.write_text(text, encoding="utf-8")

      - name: Verify generated template
        shell: python
        run: |
          from PIL import Image
          from pathlib import Path
          p=Path("daa_classic_hq_exact.png")
          if not p.exists():
              raise SystemExit("No se generó la plantilla.")
          im=Image.open(p)
          if im.size != (2168,3068):
              raise SystemExit(f"Resolución incorrecta: {im.size}")
          text=Path("app.html").read_text(encoding="utf-8")
          if "./daa_classic_hq_exact.png?v=20260922" not in text:
              raise SystemExit("app.html no apunta a la plantilla nueva.")
          print("OK: DAA clásico 2168x3068 y app.html actualizado.")

      - name: Commit only DAA template replacement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.html daa_classic_hq_exact.png
          git diff --cached --quiet && exit 0
          git commit -m "Usar DAA clásico nítido sin cambiar el resto de la aplicación"
          git push
