name: Verificar envio directo
on:
  push:
    branches: [auditoria-envio-directo-20261028]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --prefix /tmp/allzone-audit playwright@1.62.1 pngjs@7.0.0
      - run: /tmp/allzone-audit/node_modules/.bin/playwright install --with-deps chromium
      - run: NODE_PATH=/tmp/allzone-audit/node_modules node .audit/inmuebles.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: envio-directo-evidencias
          path: .audit-results/
          include-hidden-files: true
          retention-days: 30
