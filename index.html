alo para poder usar el GPS.':err.code===2?'No se ha podido determinar la ubicación. Inténtalo de nuevo en una zona con mejor cobertura.':'La búsqueda GPS ha tardado demasiado. Inténtalo de nuevo.';status.textContent=msg;status.className='gps-status err';},{enableHighAccuracy:true,timeout:15000,maximumAge:0})}}

x.moveTo(-2,8);x.lineTo(8,8);x.stroke()}else if(type==='Camión'){x.beginPath();x.roundRect(-58,-26,76,52,10);x.fill();x.stroke();x.fillStyle='#edf3f6';x.beginPath();x.roundRect(-46,-14,44,28,6);x.fill();x.stroke();x.fillStyle='#fff';x.beginPath();x.roundRect(18,-19,28,38,8);x.fill();x.stroke();x.fillStyle='#edf3f6';x.fillRect(22,-12,16,14);x.strokeRect(22,-12,16,14)}else{x.beginPath();x.roundRect(-46,-24,92,48,14);x.fill();x.stroke();x.fillStyle='#edf3f6';x.beginPath();x.roundRect(-24,-18,48,36,8);x.fill();x.stroke();x.fillStyle='#fff'}x.fillStyle=it.side==='A'?'#15a8df':it.side==='B'?'#d3b900':'#087f73';x.font='bold 22px Arial';x.textAlign='center';x.textBaseline='middle';x.fillText(it.side,0,0);x.strokeStyle=selected?'#d92d20':'#25303b';x.lineWidth=selected?4:3;x.beginPath();x.moveTo(40,0);x.lineTo(62,0);x.moveTo(62,0);x.lineTo(54,-7);x.moveTo(62,0);x.lineTo(54,7);x.stroke();if(selected){x.strokeStyle='#d92d20';x.setLineDash([8,6]);x.strokeRect(-68,-34,136,68);x.setLineDash([])}x.restore()}function redraw(){bg();sketchMeta.items.forEach((it,i)=>drawVeh(it,i===sketchMeta.selected));x.strokeStyle='#111';x.lineWidth=4;x.lineCap='round';sketchMeta.lines.forEach(l=>{if(l.length<2)return;x.beginPath();x.moveTo(l[0][0],l[0][1]);l.slice(1).forEach(p=>x.lineTo(p[0],p[1]));x.stroke()});state.sketchMeta=JSON.parse(JSON.stringify(sketchMeta));state.sketch=c.toDataURL('image/png');const sel=sketchMeta.items[sketchMeta.selected];$('#sketchStatus').textContent=sel?`Vehículo ${sel.side} seleccionado · arrástralo para moverlo o usa los botones para girarlo.`:'Toca un vehículo para seleccionarlo, arrástralo para moverlo y usa los botones de giro para rotarlo.'}function pt(e){const r=c.getBoundingClientRect();return[(e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height]}function hitTest(p){for(let i=sketchMeta.items.length-1;i>=0;i--){const it=sketchMeta.items[i],dx=p[0]-it.x,dy=p[1]-it.y;if(Math.abs(dx)<70&&Math.abs(dy)<40)return i}return -1}redraw();$$('[data-road]').forEach(b=>b.onclick=()=>{sketchMeta.road=b.dataset.road;redraw()});$$('[data-tool]').forEach(b=>b.onclick=()=>{tool=b.dataset.tool;$$('[data-tool]').forEach(z=>z.classList.toggle('active',z===b))});$$('[data-tool]').forEach(z=>z.classList.toggle('active',z.dataset.tool==='select'));$('#clearSketch').onclick=()=>{sketchMeta.items=[];sketchMeta.lines=[];sketchMeta.selected=-1;redraw()};$('#rotateLeft').onclick=()=>{if(sketchMeta.selected<0)return;sketchMeta.items[sketchMeta.selected].rot=(sketchMeta.items[sketchMeta.selected].rot||0)-Math.PI/12;redraw()};$('#rotateRight').onclick=()=>{if(sketchMeta.selected<0)return;sketchMeta.items[sketchMeta.selected].rot=(sketchMeta.items[sketchMeta.selected].rot||0)+Math.PI/12;redraw()};c.addEventListener('pointerdown',e=>{const p=pt(e);if(tool==='A'||tool==='B'){const ex=sketchMeta.items.findIndex(it=>it.side===tool);const item={side:tool,type:state[tool.toLowerCase()+'_vehicle_type']||'Coche',x:p[0],y:p[1],rot:0};if(ex>=0)sketchMeta.items[ex]=item;else sketchMeta.items.push(item);sketchMeta.selected=ex>=0?ex:sketchMeta.items.length-1;redraw();tool='select';$$('[data-tool]').forEach(z=>z.classList.toggle('active',z.dataset.tool==='select'));return}const hit=hitTest(p);if(hit>=0){sketchMeta.selected=hit;dragging=true;redraw();return}if(tool==='draw'){drawing=true;line=[p]}});c.addEventListener('pointermove',e=>{const p=pt(e);if(dragging&&sketchMeta.selected>=0){sketchMeta.items[sketchMeta.selected].x=p[0];sketchMeta.items[sketchMeta.selected].y=p[1];redraw();return}if(!drawing)return;line.push(p);redraw();x.strokeStyle='#111';x.lineWidth=4;x.beginPath();x.moveTo(line[0][0],line[0][1]);line.slice(1).forEach(q=>x.lineTo(q[0],q[1]));x.stroke()});c.addEventListener('pointerup',()=>{if(drawing&&line.length>1)sketchMeta.lines.push(line);drawing=false;dragging=false;line=[];redraw()});c.addEventListener('pointerleave',()=>{if(drawing&&line.length>1)sketchMeta.lines.push(line);drawing=false;dragging=false;line=[];redraw()})}
function signatureScreen(){host.innerHTML=`<div class="eyebrow">Firmas</div><h1>Firma de los dos conductores</h1><p class="lead">Revisad el parte antes de firmar. Después de cerrarlo no debe modificarse.</p><div class="card"><div class="field"><label>Firma Vehículo A</label><canvas id="sigA" class="sig" width="700" height="230"></canvas><button type="button" class="pillbtn" data-clear="A">Borrar firma A</button></div></div><div class="card"><div class="field"><label>Firma Vehículo B</label><canvas id="sigB" class="sig" width="700" height="230"></canvas><button type="button" class="pillbtn" data-clear="B">Borrar firma B</button></div></div>`;['A','B'].forEach(side=>sigPad($('#sig'+side),side));$$('[data-clear]').forEach(b=>b.onclick=()=>{state['sig'+b.dataset.clear]='';signatureScreen()})}
function sigPad(c,side){const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);if(state['sig'+side]){const im=new Image();im.onload=()=>x.drawImage(im,0,0,c.width,c.height);im.src=state['sig'+side]}let on=false;x.strokeStyle='#111';x.lineWidth=4;x.lineCap='round';function p(e){const r=c.getBoundingClientRect();return[(e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height]}c.onpointerdown=e=>{on=true;const q=p(e);x.beginPath();x.moveTo(q[0],q[1])};c.onpointermove=e=>{if(!on)return;const q=p(e);x.lineTo(q[0],q[1]);x.stroke()};c.onpointerup=()=>{on=false;state['sig'+side]=c.toDataURL('image/png')}}

function extraKey(i,k){return `extra_${i}_${k}`}
function extraLabel(i){return String.fromCharCode(67+i)}
function ensureExtraDefaults(){
  const n=Math.max(1,Math.min(20,parseInt(state.additional_vehicle_count||'1',10)||1));
  state.additional_vehicle_count=String(n);
  for(let i=0;i<n;i++){
    const p=`extra_${i}_`;
    if(!state[p+'vehicle_type'])state[p+'vehicle_type']='Coche';
    if(!state[p+'plate_country'])state[p+'plate_country']='España';
    if(!state[p+'driver_country'])state[p+'driver_country']='España';
    if(!state[p+'insured_country'])state[p+'insured_country']='España';
    if(!state.extraCircA[i])state.extraCircA[i]={};
    if(!state.extraCircB[i])state.extraCircB[i]={};
    if(!Array.isArray(state[p+'impacts']))state[p+'impacts']=[];
  }
}

  bindBasic();
  const inp=$('#extraCount');
  const clamp=()=>{let n=parseInt(inp.value||'1',10)||1;n=Math.max(1,Math.min(20,n));inp.value=n;state.additional_vehicle_count=String(n);ensureExtraDefaults()};

}

function getSteps(){
  ensureExtraDefaults();
  const out=[];
  for(const s of baseSteps){
    if(s.conditional==='extras' && state.other_vehicles_damage!=='Sí')continue;
    if(s.conditional==='property' && state.other_objects_damage!=='Sí')continue;
    out.push(s);
    if(s.title==='Impacto B' && state.other_vehicles_damage==='Sí'){
      const n=Math.max(1,Math.min(20,parseInt(state.additional_vehicle_count||'1',10)||1));
      for(let i=0;i<n;i++)out.push({title:`Datos adicional ${extraLabel(i)}`,extraIndex:i,render(){extraDetailsStep(i)}});
    }
    if(s.title==='Firmas' && state.other_vehicles_damage==='Sí'){
      const n=Math.max(1,Math.min(20,parseInt(state.additional_vehicle_count||'1',10)||1));
      for(let i=0;i<n;i++)out.push({title:`Firma adicional ${extraLabel(i)}`,extraIndex:i,render(){extraImpactCircSignatureStep(i)}});
    }
  }
  return out;
}

function writePdf(pages){

 const write=s=>{const b=typeof s==='string'?enc.encode(s):s;chunks.push(b);length+=b.length;};

 write('%PDF-1.4\n');write(new Uint8Array([37,226,227,207,211,10]));

 pages.forEach((p,i)=>{
  const n=3+3*i;
  obj(n,'<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+PAGE_W+' '+PAGE_H+'] /Resources << /XObject << /PageImage '+(n+2)+' 0 R >> >> /Contents '+(n+1)+' 0 R >>');
  const scale=Math.min(PAGE_W/p.width,PAGE_H/p.height);
  const dw=p.width*scale,dh=p.height*scale,dx=(PAGE_W-dw)/2,dy=(PAGE_H-dh)/2;
  const commands='q\n'+dw.toFixed(3)+' 0 0 '+dh.toFixed(3)+' '+dx.toFixed(3)+' '+dy.toFixed(3)+' cm\n/PageImage Do\nQ\n';
  obj(n+1,'<< /Length '+enc.encode(commands).length+' >>\nstream\n'+commands+'endstream');
  offset[n+2]=length;
  write((n+2)+' 0 obj\n<< /Type /XObject /Subtype /Image /Width '+p.width+' /Height '+p.height+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /'+p.filter+' /Length '+p.bytes.length+' >>\nstream\n');
  write(p.bytes);write('\nendstream\nendobj\n');
 });

 write('xref\n0 '+size+'\n0000000000 65535 f \n');

async function notesPage(title,rows){const pages=[];let c=blankPage(title,'Datos adicionales del accidente'),x=c.getContext('2d'),y=340;for(const [label,value] of rows){if(!value)continue;if(y>2040){pages.push(await pageRecord(c));c=blankPage(title+' (continuación)','');x=c.getContext('2d');y=340;}x.fillStyle='#173d32';x.font='bold 28px Arial';x.fillText(label,86,y);x.font='27px Arial';x.fillStyle='#243e34';const n=wrapText(x,value,86,y+42,1470,37,40);y+=82+n*37;}pages.push(await pageRecord(c));return pages;}
async function buildDocument(mode='pair',partner='B',demo=false){await artworkReady;await Promise.all([...photoJobs.values()]);const pages=[];if(mode==='photos'){pages.push(...await photoPages());if(!pages.length)throw new Error('Añade al menos una foto y espera a ver la miniatura.');}
 else{const partners=mode==='full'?activeVehicles().slice(1):[partner];for(const s of partners){const part=await daaPage(s,demo);pages.push(await pageRecord(part.canvas,true));part.canvas.width=part.canvas.height=1;if(part.overflow.length)pages.push(...await notesPage('Datos ampliados del parte A–'+s,part.overflow.map((v,i)=>['Dato '+(i+1),v])));if(s!=='B')pages.push(...await notesPage('Correspondencia del parte A–'+s,[['Identificación','En la columna B del DAA anterior figura el vehículo '+s+' del expediente: '+(state[prefixOf(s)+'plate']||'')]]));}if(mode==='full')pages.push(...await notesPage('Ubicación exacta del accidente',[['Dirección',state.acc_place],['Código postal',state.acc_postcode],['Coordenadas GPS',state.acc_lat&&state.acc_lon?Number(state.acc_lat).toFixed(6)+', '+Number(state.acc_lon).toFixed(6):''],['Precisión GPS',state.acc_accuracy?Math.round(Number(state.acc_accuracy))+' m':'']]));if(mode==='full'&&state.other_objects_damage==='Sí')pages.push(...await notesPage('Daños a propiedad',[['Bien',state.property_type],['Descripción',state.property_description],['Titular',state.property_owner],['Contacto',state.property_owner_contact],['Dirección',state.property_address],['Aseguradora',state.property_insurer],['Póliza',state.property_policy],['Daños',state.property_damage_description]]));if(mode==='full'){const appendix=await photoPages();if(!appendix.length)throw new Error('El informe completo necesita las fotografías del accidente. No se ha generado un PDF incompleto.');pages.push(...appendix);}if(mode==='pairPhotos')pages.push(...await photoPages(partner));}
 return {blob:writePdf(pages),pages:pages.length};}
const downloadUrls=[];
async function downloadPdf(mode='pair',partner='B'){if(pdfBusy)return;sync();pdfBusy=true;nextBtn.disabled=true;const note=document.getElementById('pdfStatus');if(note)note.textContent='Preparando el documento…';await new Promise(r=>requestAnimationFrame(r));try{const result=await buildDocument(mode,partner);const url=URL.createObjectURL(result.blob);downloadUrls.push(url);while(downloadUrls.length>6)URL.revokeObjectURL(downloadUrls.shift());const clean=v=>String(v||'sin_datos').replace(/[^A-Za-z0-9_-]/g,'_'),name=(mode==='photos'?'FOTOS_':mode==='full'?'EXPEDIENTE_':'DAA_')+'ALLZONE_'+clean(state.acc_date)+'_'+clean(state.a_plate)+'_'+clean(state[prefixOf(partner)+'plate'])+'.pdf';const box=document.getElementById('pdfResults');if(box)box.innerHTML=`<a class="download-link" href="${url}" download="${name}">Guardar ${esc(name)}</a><a class="download-link" href="${url}" target="_blank" rel="noopener">Ver y comprobar PDF</a>`;const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();if(getSteps()[idx]?.title==='Revisión'&&mode!=='photos'){
 try{
  await clearPersistedDraft();
  if(note)note.textContent=result.pages+' página(s) · '+(result.blob.size/1024/1024).toFixed(2)+' MB. Parte finalizado: los datos y fotos guardados en este navegador se han borrado. Puedes seguir usando esta pestaña, pero al volver a abrir la aplicación empezará un parte nuevo.';
 }catch(clearErr){
  console.error(clearErr);
  if(note)note.textContent=result.pages+' página(s) · '+(result.blob.size/1024/1024).toFixed(2)+' MB. El PDF se ha generado, pero no se pudo borrar el borrador local. Antes de otro parte, recarga y elige no continuar el borrador.';
 }
}else if(note)note.textContent=result.pages+' página(s) · '+(result.blob.size/1024/1024).toFixed(2)+' MB. El archivo está preparado; no se ha enviado por correo.';}catch(e){if(note)note.textContent='No se pudo generar: '+e.message;else navMessage(e.message);console.error(e);}finally{pdfBusy=false;nextBtn.disabled=false;}}
const MAIL_API='https://parte-accidente-mailer-production.up.railway.app';
function blobToBase64(blob){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(String(r.result).split(',')[1]||'');r.onerror=()=>reject(r.error||new Error('No se pudo preparar el PDF.'));r.readAsDataURL(blob);});}
async function sendReportByEmail(){
 if(pdfBusy)return;
 sync();
 const recipients=[String(state.b_copy_email||'').trim()].filter(Boolean);
 const emailField=document.querySelector('[data-field="b_copy_email"]');
 if(!recipients.length||!emailField||!emailField.checkValidity()){navMessage('Introduce un correo válido del contrario.');emailField?.focus();return;}
 pdfBusy=true;nextBtn.disabled=true;
 const note=document.getElementById('pdfStatus');
 const btn=document.getElementById('sendAndFinish')||document.getElementById('sendEmailReport');
 if(btn)btn.disabled=true;
 if(note)note.textContent='Generando y enviando el parte…';
 try{
  const result=await buildDocument('pair','B');
  const pdfBase64=await blobToBase64(result.blob);
  const clean=v=>String(v||'sin_datos').replace(/[^A-Za-z0-9_-]/g,'_');
  const filename='DAA_ALLZONE_'+clean(state.acc_date)+'_'+clean(state.a_plate)+'_'+clean(state.b_plate)+'.pdf';
  const response=await fetch(MAIL_API+'/send-report',{
   method:'POST',
   headers:{'Content-Type':'application/json'},
   body:JSON.stringify({recipients,filename,pdfBase64,plateA:state.a_plate,plateB:state.b_plate,date:state.acc_date,place:state.acc_place,postcode:state.acc_postcode})
  });
  let data={};try{data=await response.json();}catch{}
  if(!response.ok||!data.ok){
   if(data.error==='mail_not_configured')throw new Error('El envío automático todavía no está autorizado. Falta activar la cuenta de correo una sola vez.');
   if(data.error==='mail_provider_rejected')throw new Error('El proveedor de correo rechazó el envío'+(data.failedRecipient?' a '+data.failedRecipient:'')+'.');
   throw new Error('El servidor de correo no pudo completar el envío.');
  }
  if(note)note.textContent='Correo enviado. Preparando el informe completo con las fotografías…';
  finalFleetReport=await buildFinalFleetReportFile();
  await clearPersistedDraft();
  idx=getSteps().findIndex(s=>s.title==='Revisión');
  render();
 }catch(e){
  if(note)note.textContent='No se ha enviado el parte: '+e.message+' Tus datos se conservan.';
  console.error(e);
 }finally{
  pdfBusy=false;nextBtn.disabled=false;if(btn)btn.disabled=false;
 }
}
let finalFleetReport=null,finalFleetReportPreparing=false;
async function buildFinalFleetReportFile(){
 await Promise.all([...photoJobs.values()]);
 const expected=photoTargets().filter(t=>photos.has(t.key));
 if(!expected.length)throw new Error('No hay fotografías cargadas. Vuelve a la pantalla de fotos antes de finalizar.');
 const result=await buildDocument('full','B');
 const clean=v=>String(v||'sin_datos').replace(/[^A-Za-z0-9_-]/g,'_');
 const name='INFORME_UNICO_FLOTA_ALLZONE_'+clean(state.acc_date)+'_'+clean(state.a_plate)+'_'+clean(state.b_plate)+'.pdf';
 const file=new File([result.blob],name,{type:'application/pdf',lastModified:Date.now()});
 return {blob:result.blob,file,name,pages:result.pages,photoCount:expected.length};
}
async function prepareFinalFleetReport(){
 if(finalFleetReport){const btn=document.getElementById('downloadFullOnly'),status=document.getElementById('finalReportStatus');if(status)status.textContent='1 único PDF · '+finalFleetReport.pages+' página(s) · '+finalFleetReport.photoCount+' foto(s) incluidas · '+(finalFleetReport.blob.size/1024/1024).toFixed(2)+' MB · Parte + ubicación + fotos.';if(btn){btn.disabled=false;btn.textContent='DESCARGAR INFORME COMPLETO PARA FLOTA';}return;}if(finalFleetReportPreparing)return;
 finalFleetReportPreparing=true;
 const btn=document.getElementById('downloadFullOnly'),status=document.getElementById('finalReportStatus');
 if(btn){btn.disabled=true;btn.textContent='PREPARANDO INFORME COMPLETO…';}
 if(status)status.textContent='Generando parte, fotografías y ubicación…';
 try{
  finalFleetReport=await buildFinalFleetReportFile();
  if(status)status.textContent='1 único PDF · '+finalFleetReport.pages+' página(s) · '+finalFleetReport.photoCount+' foto(s) incluidas · '+(finalFleetReport.blob.size/1024/1024).toFixed(2)+' MB · Parte + ubicación + fotos.';
  if(btn){btn.disabled=false;btn.textContent='DESCARGAR INFORME COMPLETO PARA FLOTA';}
 }catch(e){
  finalFleetReport=null;
  if(status)status.textContent='No se pudo preparar el informe: '+e.message;
  if(btn){btn.disabled=false;btn.textContent='REINTENTAR INFORME COMPLETO PARA FLOTA';}
 }finally{finalFleetReportPreparing=false;}
}
async function downloadOrShareFleetReport(){
 const btn=document.getElementById('downloadFullOnly'),status=document.getElementById('finalReportStatus');
 if(!finalFleetReport){await prepareFinalFleetReport();if(!finalFleetReport)return;}
 const {blob,file,name}=finalFleetReport;
 try{
  if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){
   await navigator.share({files:[file],title:'Informe único Parte Accidente Allzone',text:'Un único PDF para Flota con el parte, todas las fotografías y la ubicación del accidente.'});
   if(status)status.textContent='Informe preparado. Puedes enviarlo por WhatsApp desde el menú Compartir.';
   return;
  }
 }catch(e){if(e&&e.name==='AbortError')return;console.warn('Compartir PDF no disponible',e);}
 const url=URL.createObjectURL(blob);downloadUrls.push(url);while(downloadUrls.length>6)URL.revokeObjectURL(downloadUrls.shift());
 const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();
 if(status)status.textContent='Informe descargado. En el móvil puedes adjuntarlo en WhatsApp como documento.';
}
function reviewScreen(){host.innerHTML=`<div class="eyebrow">Finalizado</div><h1>Parte enviado correctamente</h1><p class="lead">El parte se ha enviado por correo. Para Flota se genera <b>un único PDF</b> que contiene el parte, todas las fotografías y la ubicación del accidente.</p><div class="card"><p><b>Dirección:</b> ${esc(state.acc_place||'—')}</p><p><b>Código postal:</b> ${esc(state.acc_postcode||'—')}</p><button type="button" class="pillbtn primary" id="downloadFullOnly" disabled>PREPARANDO INFORME COMPLETO…</button><p class="hint">WhatsApp recibirá un solo archivo PDF. Las fotografías y la ubicación van dentro del mismo documento, no como archivos separados.</p><div id="finalReportStatus" role="status">Generando informe…</div></div>`;document.getElementById('downloadFullOnly').onclick=downloadOrShareFleetReport;prepareFinalFleetReport();}
function openDaaDocument(){return downloadPdf('pair');}
const oldDelivery=baseSteps.find(s=>s.title==='Entrega');oldDelivery.render=function(){host.innerHTML=`<div class="eyebrow">Envío</div><h1>Correo del contrario</h1><p class="lead">Introduce el correo del conductor o asegurado del vehículo B. Flota recibirá automáticamente otra copia.</p><div class="card">${field('b_copy_email','Correo del contrario','email',{required:true})}<div class="fixed">Copia automática para Flota: flota@allzonelogistics.com</div><button type="button" class="pillbtn primary" id="sendAndFinish" disabled>ENVIAR Y FINALIZAR</button><div id="pdfStatus" role="status"></div></div>`;bindBasic();const email=document.querySelector('[data-field="b_copy_email"]'),btn=document.getElementById('sendAndFinish');const refresh=()=>{state.b_copy_email=email.value;btn.disabled=!(email.value&&email.checkValidity())||pdfBusy;};email.addEventListener('input',refresh);refresh();btn.onclick=sendReportByEmail;};
const now=new Date(),pad=n=>String(n).padStart(2,'0');state.acc_date=now.getFullYear()+'-'+pad(now.getMonth()+1)+'-'+pad(now.getDate());state.acc_time=pad(now.getHours())+':'+pad(now.getMinutes());
window.AllzoneV16={version:VERSION,artworkReady,buildDocument,photos,navTimes,step:()=>({index:idx,title:getSteps()[idx].title}),show:title=>{sync();idx=getSteps().findIndex(s=>s.title===title);render();},render,ready:()=>photoJobs.size===0};
window.addEventListener('pagehide',saveMeta);render();restore();
