<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="theme-color" content="#087f73">
<title>Parte Accidente Allzone</title>
<style>
html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:#f5fbfa;color:#18322d}
body{display:grid;place-items:center}
main{text-align:center;padding:32px}
.spinner{width:46px;height:46px;border:5px solid #cfe8e4;border-top-color:#087f73;border-radius:50%;margin:0 auto 18px;animation:s .8s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<main><div class="spinner"></div><strong>Abriendo Parte Accidente actualizado…</strong></main>
<script>
(function(){
  var target='./app.html?actualizacion='+Date.now();
  window.location.replace(target);
})();
</script>
</body>
</html>
